services:
  pinat-auth:
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: build

    ports:
      - "${APP_PORT}:8000"

    environment:
      APP_NAME: ${APP_NAME:-PinatAuth}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Session
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}

      # JWT
      JWT_PRIVATE_KEY_PATH: /var/www/html/storage/jwt/private.key
      JWT_PUBLIC_KEY_PATH: /var/www/html/storage/jwt/public.key
      JWT_TTL: ${JWT_TTL:-3600}

      # Cache / Queue
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}

    volumes:
      - pinat-auth-storage:/var/www/html/storage

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pinat-auth-storage: